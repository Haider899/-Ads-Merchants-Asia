name: Deploy to VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm install --ignore-scripts --no-audit --no-fund

    - name: Check JavaScript syntax
      run: |
        node --check server.js
        find server client/assets/js js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

    - name: Run tests
      run: npm test

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Load deployment SSH key
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

    - name: Trust VPS host key
      run: ssh-keyscan -H "${{ secrets.VPS_IP }}" >> "$HOME/.ssh/known_hosts"

    - name: Deploy to VPS
      env:
        VPS_IP: ${{ secrets.VPS_IP }}
        VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
      run: |
        set -euo pipefail
        ssh -o BatchMode=yes -o IdentitiesOnly=no "$VPS_USERNAME@$VPS_IP" 'bash -s' <<'REMOTE_SCRIPT'
        set -euo pipefail
        if [ -d "/var/www/ads-merchants-asia" ]; then
          cd /var/www/ads-merchants-asia
        elif [ -d "/var/www/amazon-asia" ]; then
          cd /var/www/amazon-asia
        else
          cd /var/www/html || exit 1
        fi
        git fetch origin main
        git reset --hard origin/main
        npm install --production
        pm2 restart all || true
        REMOTE_SCRIPT
