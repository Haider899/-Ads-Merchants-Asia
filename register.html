<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Ads Merchants Asia - Create An Account</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta content="Amazon Asia Merchant" name="description" />
    <meta content="" name="author" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    
    <!-- App favicon -->
    <link rel="shortcut icon" href="https://adsmerchantsasia.com/assets/uploads/logo/1742595477_icon.png">
    
    <!-- Fonts, Bootstrap & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dripicons@2.0.0/css/dripicons.css">

    <style>
        body, html {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #edf0f5;
        }

        .align-self-center {
            padding-top: 40px;
            padding-bottom: 40px;
        }

        .account-body.accountbg {
            background: #edf0f5;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-page {
            max-width: 520px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background-color: #fff;
            color: #000;
            border: none;
            border-radius: 0.5rem;
            box-shadow: 0px 4px 20px rgba(31, 30, 47, 0.08) !important;
        }

        .card-body {
            padding: 2.2rem 2rem 1.8rem;
        }

        .auth-logo-box {
            text-align: center;
            margin-bottom: 10px;
        }

        .auth-logo-box .auth-logo {
            border-radius: 1rem;
            background-color: #fff;
            padding: 4px;
            height: 110px;
            max-width: 220px;
            object-fit: contain;
        }

        .account-body .auth-card .auth-logo-text h4 {
            font-weight: 600;
            color: #000;
            font-size: 22px;
            font-family: 'Poppins', sans-serif;
        }

        .text-muted {
            color: #000 !important;
            font-size: 13.5px;
            line-height: 1.5;
        }

        label {
            font-weight: 400;
            color: #000;
            font-size: 13px;
            margin-bottom: 6px;
            display: block;
        }

        .text-danger {
            color: #ef4d56 !important;
        }

        .input-group {
            position: relative;
        }

        .form-control {
            height: 42px;
            border: 1px solid #e8ebf3;
            border-radius: 4px;
            padding: 6px 42px 6px 14px;
            font-size: 13px;
            color: #303e67;
            background-color: #fff;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        select.form-control {
            padding-right: 14px;
        }

        .form-control::placeholder {
            color: #b0b7c7;
        }

        .form-control:focus {
            border-color: #4d69db;
            box-shadow: 0 0 0 0.15rem rgba(77, 105, 219, 0.15);
            background-color: #fff;
            color: #303e67;
        }

        .auth-form .auth-form-icon {
            width: 32px;
            height: 32px;
            background-color: #edf0f5;
            text-align: center;
            line-height: 32px;
            border-radius: 50%;
            position: absolute;
            right: 5px;
            z-index: 10;
            top: 5px;
            color: #303e67;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s;
        }

        .auth-form .auth-form-icon:hover {
            color: #f3771d;
        }

        .btn-gradient-warning {
            background: linear-gradient(14deg, #f3771d 0%, #f79839 100%);
            border: none;
            color: #fff !important;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 20px;
            box-shadow: 0 4px 12px rgba(243, 119, 29, 0.3) !important;
            transition: all 0.3s ease-out;
        }

        .btn-gradient-warning:hover {
            background: linear-gradient(14deg, #e56a10 0%, #f3771d 100%);
            box-shadow: 0 6px 16px rgba(243, 119, 29, 0.45) !important;
            transform: translateY(-1px);
        }

        .btn-gradient-warning:active {
            transform: translateY(0);
        }

        .btn-round {
            border-radius: 30px;
        }

        p a:hover, a:hover {
            color: #4d69db !important;
            text-decoration: none;
        }

        .orange-link {
            color: #f3771d !important;
            transition: color 0.2s;
        }

        .orange-link:hover {
            color: #d6600c !important;
            text-decoration: underline;
        }

        .custom-control-label {
            font-size: 12.5px;
            color: #303e67;
            line-height: 1.4;
            padding-top: 2px;
        }

        /* Toast notification */
        .toast-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            min-width: 280px;
            background: #fff;
            border-left: 4px solid #f3771d;
            border-radius: 4px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            padding: 12px 18px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 576px) {
            .align-self-center {
                padding-top: 20px;
                padding-bottom: 20px;
            }
            .card-body {
                padding: 1.5rem 1.2rem;
            }
            .auth-logo-box .auth-logo {
                height: 90px;
            }
        }
    </style>
</head>
<body class="account-body accountbg">

    <!-- Toast Notification -->
    <div id="toastNotification" class="toast-notification">
        <div id="toastMsg" style="font-size: 13px; font-weight: 500; color: #303e67;"></div>
    </div>

    <!-- Registration page -->
    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5 align-self-center">
                <div class="auth-page">
                    <div class="card auth-card shadow-lg">
                        <div class="card-body">
                            <div class="px-2">
                                <div class="text-center auth-logo-text">
                                    <div class="auth-logo-box">
                                        <a href="index.html" class="logo logo-admin">
                                            <img src="https://adsmerchantsasia.com/assets/uploads/logo/1764857545_1743035462_logonew.webp" alt="Ads Merchants Asia Logo" class="auth-logo">
                                        </a>
                                    </div>
                               
                                    <h4 class="mt-0 mb-2 mt-3">Create An Account</h4>
                                    <p class="text-muted mb-0" style="font-family:Poppins,sans-serif">
                                        Sign up or Login Today to shop and earn cash! Withdrawal to bank account. (Limited to one mobile number)
                                    </p>  
                                </div> 

                                <form id="registerForm" action="https://adsmerchantsasia.com/addUser" class="form-horizontal auth-form my-4" method="post" accept-charset="utf-8">
                                    
                                    <!-- Full Name -->
                                    <div class="form-group mb-3">
                                        <label for="fullname">Full Name <small class="text-danger font-13">*</small></label>
                                        <div class="input-group">
                                            <span class="auth-form-icon">
                                                <i class="fa-solid fa-list-ul"></i>
                                            </span>                                                                                                              
                                            <input type="text" class="form-control" name="fullname" id="fullname" placeholder="Full Name" required autocomplete="name">
                                        </div>                                    
                                    </div>

                                    <!-- User Name -->
                                    <div class="form-group mb-3">
                                        <label for="username">User Name <small class="text-danger font-13">*</small></label>
                                        <div class="input-group">
                                            <span class="auth-form-icon">
                                                <i class="fa-regular fa-user"></i>
                                            </span>                                                                                                              
                                            <input type="text" class="form-control" name="username" id="username" placeholder="User Name" required autocomplete="username">
                                        </div>                                    
                                    </div>

                                    <!-- Email -->
                                    <div class="form-group mb-3">
                                        <label for="email">Email <small class="text-danger font-13">*</small></label>
                                        <div class="input-group">
                                            <span class="auth-form-icon">
                                                <i class="fa-regular fa-envelope"></i>
                                            </span>                                                                                                              
                                            <input type="email" class="form-control" name="email" id="email" placeholder="Enter Email" required autocomplete="email">
                                        </div>                                    
                                    </div> 
                
                                    <!-- Password -->
                                    <div class="form-group mb-3">
                                        <label for="userpassword">Password <small class="text-danger font-13">*</small></label>                                            
                                        <div class="input-group"> 
                                            <span class="auth-form-icon toggle-password" id="togglePasswordBtn" title="Show Password"> 
                                                <i class="fa-regular fa-eye" id="togglePasswordIcon"></i>
                                            </span>                                                       
                                            <input type="password" class="form-control" name="password" id="userpassword" placeholder="Enter password" required autocomplete="new-password">
                                        </div>                               
                                    </div>

                                    <!-- Confirm Password -->
                                    <div class="form-group mb-3">
                                        <label for="confirmpassword">Confirm Password <small class="text-danger font-13">*</small></label>                                            
                                        <div class="input-group"> 
                                            <span class="auth-form-icon toggle-confirmpasswordpassword" id="toggleConfirmPasswordBtn" title="Show Password"> 
                                                <i class="fa-regular fa-eye" id="toggleConfirmPasswordIcon"></i>
                                            </span>                                                       
                                            <input type="password" class="form-control" name="confirmpassword" id="confirmpassword" placeholder="Confirm password" required autocomplete="new-password">
                                        </div>                               
                                    </div>

                                    <!-- Gender -->
                                    <div class="form-group mb-3">
                                        <label class="col-form-label pt-0">Gender <small class="text-danger font-13">*</small></label>
                                        <select name="gender" class="form-control" style="border-radius:4px;" required>
                                            <option value="">Select</option>
                                            <option value="Male">Male</option>
                                            <option value="Female">Female</option>
                                        </select>
                                    </div>

                                    <!-- Privacy & Terms Checkbox -->
                                    <div class="row mb-3">
                                        <div class="col-md-12">
                                            <div class="form-group mb-0">
                                                <div class="custom-control custom-checkbox">
                                                    <input type="checkbox" class="custom-control-input" id="horizontalCheckbox" checked required>
                                                    <label class="custom-control-label" for="horizontalCheckbox"> 
                                                        I agree with <a href="#" style="color:#f3771d;"> Privacy and Policy</a> and <a href="#" style="color:#f3771d;"> Terms and Conditions</a>
                                                    </label>
                                                </div>
                                            </div>              
                                        </div>
                                    </div>
        
                                    <!-- Submit Button -->
                                    <div class="form-group mb-0 row">
                                        <div class="col-12 mt-1">
                                            <button type="submit" class="btn btn-gradient-warning btn-round btn-block waves-effect waves-light login_in" id="registerBtn" style="box-shadow: none;">
                                                <span id="regBtnText">Create Account <i class="fas fa-sign-in-alt ml-1"></i></span>
                                            </button>
                                        </div> 
                                    </div>
                                </form>

                                <!-- Having Account Switch -->
                                <div class="row mt-3 mb-3">
                                    <div class="col-sm-12 text-center">
                                        <i class="fa-solid fa-lock" style="font-size:12px; color:#7081b9;"></i> Having Account
                                        <a href="index.html" class="text-muted font-13"> 
                                            <span style="color:#f3771d; font-weight: 500;">Login here</span>
                                        </a>                                    
                                    </div>
                                </div>

                                <p style="text-align:center; margin-bottom:0px !important; font-size:12px; color:#7081b9;">
                                    &copy; <script>document.write(new Date().getFullYear())</script> 
                                    <a href="https://adsmerchantsasia.com/" target="_blank" style="color:#f3771d;">Ads Merchants Asia </a>. All rights reserved.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>          
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Password toggle
        $(document).on('click', '.toggle-password', function() {
            var input = $("#userpassword");
            var icon = $("#togglePasswordIcon");
            if (input.attr('type') === 'password') {
                input.attr('type', 'text');
                icon.removeClass("fa-eye").addClass("fa-eye-slash");
            } else {
                input.attr('type', 'password');
                icon.removeClass("fa-eye-slash").addClass("fa-eye");
            }
        });

        // Confirm Password toggle
        $(document).on('click', '.toggle-confirmpasswordpassword', function() {
            var input = $("#confirmpassword");
            var icon = $("#toggleConfirmPasswordIcon");
            if (input.attr('type') === 'password') {
                input.attr('type', 'text');
                icon.removeClass("fa-eye").addClass("fa-eye-slash");
            } else {
                input.attr('type', 'password');
                icon.removeClass("fa-eye-slash").addClass("fa-eye");
            }
        });

        // Register form handler
        $('#registerForm').on('submit', function(e) {
            e.preventDefault();
            var pass = $('#userpassword').val();
            var confPass = $('#confirmpassword').val();

            if (pass !== confPass) {
                showToast("Passwords do not match. Please verify.");
                return false;
            }

            var $btn = $('#registerBtn');
            var $btnText = $('#regBtnText');
            $btn.prop('disabled', true);
            $btnText.html("<i class='fa fa-spinner fa-spin'></i> Please Wait...");
            showToast("Creating merchant account...");

            setTimeout(function() {
                showToast("Account created successfully! Redirecting to dashboard...");
                setTimeout(function() {
                    window.location.href = "dashboard";
                }, 600);
            }, 900);
        });

        function showToast(msg) {
            var toast = $('#toastNotification');
            $('#toastMsg').text(msg);
            toast.fadeIn(300);
            setTimeout(function() {
                toast.fadeOut(300);
            }, 3500);
        }
    </script>
<script src="client/assets/js/portal-bridge.js"></script>
</body>
</html>
